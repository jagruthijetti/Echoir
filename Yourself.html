<!DOCTYPE html>
<html>
    <head>
        <title>Yourself</title>
    </head>
    <body>
        <center>
            <img src="Echoirlogo.png">
            <link rel="stylesheet" href="style2.css">
        <h2 class="heading">Tell us about yourself</h2>
        <br>
        <form>
        <div class="flex-container">
            <div class="flex-item">
                <label for="name">Name</label>
                <p style="font-size: 15px;">This name will appear on your profile</p>
                <input type="text" name="name">
            </div>
            <br><br>
            <label for="dob">Date of Birth</label>
            <br>
            <div class="flex-item">
                <input type="date" name="startdate" placeholder="DD-MM-YYYY">
            </div>
        </div>
            <br><br>
            <hr>
            Gender
            <p>We use gender to help personalize your music, ads and podcasts.</p>
            <label for="male">Male</label>
                <input type="radio" name="gender" id="gender" value="male">
            <label for="female">Female</label>
                <input type="radio" name="gender" id="gender" value="female">
            <label for="not">Prefer not to say</label>
                <input type="radio" name="gender" id="gender" value="gender">
            <br><br>
            <a href="Successful.html" id="next">Next</a>
        </form>
        <hr>
        </center>
        <footer>
            &copy 2026 ECHOIR
        </footer>
    </body>
</html>
